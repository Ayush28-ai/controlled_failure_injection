services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bosch-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://bosch:${POSTGRES_PASSWORD:-bosch_dev_password}@postgres:5432/bosch
      PROMETHEUS_URL: http://prometheus:9090
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bosch-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    container_name: bosch-postgres
    environment:
      POSTGRES_DB: bosch
      POSTGRES_USER: bosch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bosch_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - bosch_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bosch -d bosch"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bosch-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bosch_postgres_data:
